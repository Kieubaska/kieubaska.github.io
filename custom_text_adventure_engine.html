<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Adventure Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #e2e8f0; /* Tailwind slate-200 */
        }
        
        .story-text {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .action-text { color: #10b981; font-style: italic; } /* Emerald Green */
        .char-name { color: #93c5fd; font-weight: 600; } /* Blue-300 */
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Screen Toggle Utilities */
        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center sm:p-4">

    <!-- Screen 1: Setup Screen -->
    <div id="setup-screen" class="max-w-3xl w-full bg-slate-800 sm:rounded-2xl shadow-2xl border-y-0 border-x-0 sm:border border-slate-700 flex flex-col h-[100dvh] sm:h-auto hidden-screen">
        <div class="bg-slate-900 p-4 border-b border-slate-700">
            <h1 class="text-xl font-bold text-white tracking-wide">Create Custom Adventure</h1>
            <p class="text-slate-400 text-sm mt-1">Define the parameters of your AI text adventure.</p>
        </div>
        <form id="setup-form" class="p-4 sm:p-6 overflow-y-auto flex flex-col gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Game Title</label>
                <input type="text" id="cfg-title" required placeholder="e.g., Cyberpunk Detective" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-2 rounded focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Story Premise / Description</label>
                <textarea id="cfg-premise" required rows="2" placeholder="You are a disgraced cop trying to solve one last case..." class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-2 rounded focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Setting</label>
                <input type="text" id="cfg-setting" required placeholder="Neo-Tokyo, 2142. Rain-slicked streets..." class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-2 rounded focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Characters (Names & Personalities)</label>
                <textarea id="cfg-characters" required rows="3" placeholder="- Jax: Ruthless cyborg merc.&#10;- Elena: Snarky hacker ally." class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-2 rounded focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Starting Scenario / Prologue</label>
                <textarea id="cfg-prologue" required rows="4" placeholder="You wake up in an alleyway. A figure stands over you..." class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-2 rounded focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <button type="submit" id="start-game-btn" class="mt-2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded transition-all">Start Custom Game</button>
            <p id="setup-loading" class="hidden text-slate-400 text-sm text-center animate-pulse mt-2">Connecting to reality...</p>
        </form>
    </div>

    <!-- Screen 2: Game Screen -->
    <div id="game-screen" class="max-w-3xl w-full bg-slate-800 sm:rounded-2xl shadow-2xl overflow-hidden border-y-0 border-x-0 sm:border border-slate-700 flex flex-col h-[100dvh] sm:h-[85vh] sm:max-h-[800px] hidden-screen">
        
        <!-- Header / Stat Tracker -->
        <div class="bg-slate-900 p-3 sm:p-4 border-b border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center z-10 shrink-0 gap-3 sm:gap-4">
            <div class="flex flex-col">
                <h1 id="ui-game-title" class="text-lg sm:text-xl font-bold text-white tracking-wide truncate max-w-[200px] sm:max-w-xs">Title</h1>
                <button id="end-game-btn" class="text-xs text-red-400 hover:text-red-300 text-left w-max">Quit / Reset</button>
            </div>
            
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 sm:gap-4 w-full sm:w-auto flex-grow justify-end">
                <div class="flex gap-4 sm:gap-6 text-xs sm:text-sm font-semibold w-full sm:w-auto">
                    <!-- Confidence Bar -->
                    <div class="flex flex-col w-1/2 sm:w-24">
                        <div class="flex justify-between text-blue-400 mb-1">
                            <span>Confidence</span>
                            <span id="stat-confidence">0</span>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-1.5">
                            <div id="stat-bar-confidence" class="bg-blue-500 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Reputation Bar -->
                    <div class="flex flex-col w-1/2 sm:w-24">
                        <div class="flex justify-between text-yellow-400 mb-1">
                            <span>Reputation</span>
                            <span id="stat-reputation">0</span>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-1.5">
                            <div id="stat-bar-reputation" class="bg-yellow-500 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <!-- Controls -->
                <div class="flex gap-2 sm:border-l sm:border-slate-700 sm:pl-4 w-full sm:w-auto justify-end">
                    <button id="export-btn" class="bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-1.5 px-3 rounded transition-colors text-white shadow-sm">Export</button>
                    <button id="import-btn" class="bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-1.5 px-3 rounded transition-colors text-white shadow-sm">Import</button>
                    <input type="file" id="import-file" accept=".json" class="hidden">
                </div>
            </div>
        </div>

        <!-- Story Display Area -->
        <div class="flex-grow p-4 sm:p-6 overflow-y-auto flex flex-col gap-4" id="story-container">
            <!-- Messages populated by JS -->
        </div>

        <!-- Input Area -->
        <div class="bg-slate-900/80 p-3 sm:p-6 border-t border-slate-700 shrink-0">
            <!-- Action Toolbar -->
            <div class="flex justify-start items-center mb-2 sm:mb-3 text-xs sm:text-sm gap-2 sm:gap-4">
                <button id="undo-btn" class="text-slate-400 hover:text-white transition-colors flex items-center gap-1 px-2 py-1 rounded hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                    </svg>
                    Undo
                </button>
                <button id="regen-btn" class="text-slate-400 hover:text-white transition-colors flex items-center gap-1 px-2 py-1 rounded hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Regenerate
                </button>
            </div>
            <form id="input-form" class="flex gap-2 sm:gap-3">
                <input type="text" id="player-input" autocomplete="off" placeholder="What do you do or say?" class="flex-grow bg-slate-800 border border-slate-600 text-slate-200 p-3 sm:p-4 text-sm sm:text-base rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <button type="submit" id="send-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 sm:py-4 sm:px-8 text-sm sm:text-base rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">Act</button>
            </form>
            <div id="loading-indicator" class="hidden text-slate-400 text-xs sm:text-sm mt-2 sm:mt-3 text-center animate-pulse">The story is unfolding...</div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Initialization
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const authToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, auth, db, userId;

        if (firebaseConfig) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        // Game State & History
        let chatHistory = [];
        let confidence = 0;
        let reputation = 0;
        let gameConfig = null;

        // DOM Elements - Screens
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        
        // DOM Elements - Setup
        const setupForm = document.getElementById('setup-form');
        const setupLoading = document.getElementById('setup-loading');
        
        // DOM Elements - Game UI
        const storyContainerEl = document.getElementById('story-container');
        const inputForm = document.getElementById('input-form');
        const playerInput = document.getElementById('player-input');
        const sendBtn = document.getElementById('send-btn');
        const undoBtn = document.getElementById('undo-btn');
        const regenBtn = document.getElementById('regen-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const exportBtn = document.getElementById('export-btn');
        const importBtn = document.getElementById('import-btn');
        const importFile = document.getElementById('import-file');
        const uiGameTitle = document.getElementById('ui-game-title');
        const endGameBtn = document.getElementById('end-game-btn');

        // Dynamically build the system prompt based on config
        function generateSystemPrompt(config) {
            return `You are the Game Master for an interactive text adventure called "${config.title}".
Premise: ${config.premise}
Setting: ${config.setting}
Characters: ${config.characters}

Rules:
1. The player will type their actions or dialogue.
2. You determine the immediate physical consequences, character reactions, and advance the scene slightly.
3. Keep the tone fitting for the premise. Allow the player to succeed, fail, or alter the course of the story.
4. Keep responses concise (1 to 3 short paragraphs).
5. Format character speech strictly like this: "CharacterName: 'Text'".
6. NEVER control the player's actions or speak for the player. Only describe the world and NPC reactions.
7. IMPORTANT: Text wrapped in asterisks (e.g., *punches the wall*) indicates a physical action performed by the player or an NPC. Process it accordingly.
8. STATS: Based on the user's input, determine if their actions should change their confidence (0-100 scale, representing self-worth/bravery) and reputation (0-100 scale, representing how others view them). At the very end of your response, you MUST append a hidden data block exactly in this format: ||STATS:{"confidence": X, "reputation": Y}|| where X and Y are the integer changes to the stats (e.g., 5, -2, 0). Do not wrap this in markdown code blocks.`;
        }

        // Helper to format text with dynamic character colors and actions
        function formatText(text) {
            let formatted = text
                // Format *actions* in emerald green italic
                .replace(/\*([^*]+)\*/g, '<span class="action-text">*$1*</span>')
                // Dynamically bold character names preceding dialogue (e.g. Name: "text" or Name: text)
                .replace(/(^|<br>)([A-Za-z0-9\s]+):/g, '$1<span class="char-name">$2:</span>')
                .replace(/\n/g, '<br>');
            return formatted;
        }

        function appendMessage(text, isPlayer = false) {
            const div = document.createElement('div');
            div.className = `p-4 rounded-lg fade-in ${isPlayer ? 'bg-blue-900/40 border border-blue-800 ml-12' : 'bg-slate-800/80 border border-slate-700 mr-12'}`;
            
            if (isPlayer) {
                div.innerHTML = `<span class="text-blue-400 font-bold text-sm uppercase tracking-wider block mb-2">You</span><div class="story-text">${formatText(text)}</div>`;
            } else {
                div.innerHTML = `<span class="text-slate-400 font-bold text-sm uppercase tracking-wider block mb-2">Story</span><div class="story-text">${formatText(text)}</div>`;
            }
            
            storyContainerEl.appendChild(div);
            setTimeout(() => {
                storyContainerEl.scrollTop = storyContainerEl.scrollHeight;
            }, 50);
        }

        function updateStatsUI() {
            document.getElementById('stat-confidence').innerText = confidence;
            document.getElementById('stat-reputation').innerText = reputation;
            document.getElementById('stat-bar-confidence').style.width = `${confidence}%`;
            document.getElementById('stat-bar-reputation').style.width = `${reputation}%`;
        }

        function switchScreen(screen) {
            setupScreen.classList.add('hidden-screen');
            gameScreen.classList.add('hidden-screen');
            
            if (screen === 'setup') {
                setupScreen.classList.remove('hidden-screen');
            } else if (screen === 'game') {
                gameScreen.classList.remove('hidden-screen');
                uiGameTitle.innerText = gameConfig.title;
            }
        }

        async function handleTurn(userAction) {
            appendMessage(userAction, true);
            playerInput.value = '';
            playerInput.disabled = true;
            sendBtn.disabled = true;
            undoBtn.disabled = true;
            regenBtn.disabled = true;
            loadingIndicator.classList.remove('hidden');

            chatHistory.push({ role: "user", parts: [{ text: userAction }] });
            const safeHistory = chatHistory.map(msg => ({ role: msg.role, parts: [...msg.parts] }));
            const sysPrompt = generateSystemPrompt(gameConfig);

            const payload = {
                contents: safeHistory,
                systemInstruction: { parts: [{ text: sysPrompt }] }
            };

            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                let response;
                let retries = 3;
                let delay = 1000;
                
                while (retries > 0) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) break;
                    } catch (err) {}
                    retries--;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }

                if (!response || !response.ok) throw new Error("Failed to fetch");

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0 && result.candidates[0].content) {
                    let aiText = result.candidates[0].content.parts[0].text;
                    
                    const statsRegex = /\|\|STATS:({.*?})\|\|/;
                    const match = aiText.match(statsRegex);
                    if (match) {
                        try {
                            const statsChange = JSON.parse(match[1]);
                            confidence = Math.max(0, Math.min(100, confidence + (statsChange.confidence || 0)));
                            reputation = Math.max(0, Math.min(100, reputation + (statsChange.reputation || 0)));
                            updateStatsUI();
                            aiText = aiText.replace(statsRegex, '').trim();
                        } catch (e) {
                            console.error("Failed to parse stats block:", e);
                        }
                    }

                    appendMessage(aiText, false);
                    chatHistory.push({ role: "model", parts: [{ text: aiText }], stats: { confidence, reputation } });
                    saveGame();
                } else {
                    appendMessage("The universe glitched. Nothing happened. (Try again)", false);
                    chatHistory.pop();
                }
            } catch (e) {
                appendMessage("The universe glitched. A rift in time occurred. (Network Error)", false);
                chatHistory.pop();
            } finally {
                playerInput.disabled = false;
                sendBtn.disabled = false;
                updateButtonStates();
                loadingIndicator.classList.add('hidden');
                playerInput.focus();
                storyContainerEl.scrollTop = storyContainerEl.scrollHeight;
            }
        }

        setupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            gameConfig = {
                title: document.getElementById('cfg-title').value.trim(),
                premise: document.getElementById('cfg-premise').value.trim(),
                setting: document.getElementById('cfg-setting').value.trim(),
                characters: document.getElementById('cfg-characters').value.trim(),
                prologue: document.getElementById('cfg-prologue').value.trim()
            };

            confidence = 0;
            reputation = 0;
            chatHistory = [];
            storyContainerEl.innerHTML = '';
            
            chatHistory.push({ role: "user", parts: [{ text: "Start the game with the initial scenario/prologue." }] });
            chatHistory.push({ role: "model", parts: [{ text: gameConfig.prologue }], stats: { confidence: 0, reputation: 0 } });
            
            appendMessage(gameConfig.prologue, false);
            updateStatsUI();
            updateButtonStates();
            switchScreen('game');
            saveGame();
        });

        inputForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = playerInput.value.trim();
            if(val) {
                handleTurn(val);
            }
        });

        function updateButtonStates() {
            const canModify = chatHistory.length > 2; 
            undoBtn.disabled = !canModify;
            regenBtn.disabled = !canModify;
        }

        function restoreStatsFromLastTurn() {
            const lastTurn = chatHistory[chatHistory.length - 1];
            if (lastTurn && lastTurn.stats) {
                confidence = lastTurn.stats.confidence;
                reputation = lastTurn.stats.reputation;
            } else {
                confidence = 0;
                reputation = 0;
            }
            updateStatsUI();
        }

        undoBtn.addEventListener('click', () => {
            if (chatHistory.length <= 2) return;
            chatHistory.pop(); 
            chatHistory.pop(); 
            restoreStatsFromLastTurn();
            rebuildChatUI();
            updateButtonStates();
            saveGame();
        });

        regenBtn.addEventListener('click', () => {
            if (chatHistory.length <= 2) return;
            chatHistory.pop(); 
            const lastUserTurn = chatHistory.pop(); 
            restoreStatsFromLastTurn();
            rebuildChatUI();
            handleTurn(lastUserTurn.parts[0].text);
        });

        exportBtn.addEventListener('click', () => {
            const saveData = { gameConfig, chatHistory, confidence, reputation };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(saveData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `${gameConfig.title.replace(/\s+/g, '_')}_save.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });

        importBtn.addEventListener('click', () => { importFile.click(); });

        importFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const loadedData = JSON.parse(event.target.result);
                    if (loadedData.gameConfig && loadedData.chatHistory) {
                        gameConfig = loadedData.gameConfig;
                        chatHistory = loadedData.chatHistory;
                        confidence = loadedData.confidence || 0;
                        reputation = loadedData.reputation || 0;
                        
                        rebuildChatUI();
                        updateStatsUI();
                        updateButtonStates();
                        switchScreen('game');
                        saveGame(); 
                    } else {
                        throw new Error("Invalid format");
                    }
                } catch(error) {
                    alert("Error parsing save file. Ensure it is a valid custom text adventure save.");
                }
            };
            reader.readAsText(file);
            importFile.value = ''; 
        });

        endGameBtn.addEventListener('click', async () => {
            if (confirm("Are you sure you want to quit? Your cloud save will be deleted.")) {
                if (userId && db) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'gameState', 'default'));
                    } catch(e) { console.error("Failed to delete save"); }
                }
                gameConfig = null;
                chatHistory = [];
                switchScreen('setup');
            }
        });

        function rebuildChatUI() {
            storyContainerEl.innerHTML = '';
            for(let i = 1; i < chatHistory.length; i++) {
                const msg = chatHistory[i];
                appendMessage(msg.parts[0].text, msg.role === 'user');
            }
        }

        async function saveGame() {
            if (!userId || !db || !gameConfig) return;
            try {
                const gameDoc = doc(db, 'artifacts', appId, 'users', userId, 'gameState', 'default');
                await setDoc(gameDoc, { gameConfig, chatHistory, confidence, reputation });
            } catch (e) {
                console.error("Save failed:", e);
            }
        }

        async function initApp() {
            // Setup Auth first
            if (auth) {
                try {
                    if (authToken) {
                        await signInWithCustomToken(auth, authToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                    userId = auth.currentUser.uid;
                } catch(e) {
                    console.error("Auth failed:", e);
                }
            }

            let loaded = false;
            if (userId && db) {
                try {
                    const docSnap = await getDoc(doc(db, 'artifacts', appId, 'users', userId, 'gameState', 'default'));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.gameConfig && data.chatHistory && data.chatHistory.length > 0) {
                            gameConfig = data.gameConfig;
                            chatHistory = data.chatHistory;
                            confidence = data.confidence || 0;
                            reputation = data.reputation || 0;
                            loaded = true;
                            
                            rebuildChatUI();
                            updateStatsUI();
                            updateButtonStates();
                            switchScreen('game');
                        }
                    }
                } catch(e) {
                    console.error("Load failed:", e);
                }
            }

            if (!loaded) {
                switchScreen('setup');
            }
        }

        initApp();
    </script>
</body>
</html>
