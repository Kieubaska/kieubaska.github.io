<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Text Adventure Engine</title>
    <style>
        :root {
            --bg-black: #000000;
            --bg-panel: #0a0a0a;
            --bg-card: #121212;
            --bg-input: #161616;
            --border-color: #262626;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --accent-blue: #3b82f6;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --accent-purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 720px;
            height: 100dvh;
            max-height: 900px;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 720px) {
            .app-container {
                max-height: 100dvh;
                border: none;
                border-radius: 0;
            }
        }

        .hidden {
            display: none !important;
        }

        /* Setup Screen */
        .setup-screen {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .setup-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .setup-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: -8px;
            line-height: 1.4;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 500px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        label {
            font-size: 0.78rem;
            font-weight: 600;
            color: #bbbbbb;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .opt-badge {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
        }

        input, textarea, select {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #555555;
        }

        textarea {
            resize: vertical;
            min-height: 76px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: var(--bg-black);
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            flex: 2;
        }

        .btn-secondary {
            background-color: #1c1c1c;
            color: var(--text-main);
            border: 1px solid #333333;
            padding: 14px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background-color: #282828;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled, .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-small {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-small:hover {
            background-color: #222222;
        }

        .badge-ai {
            border-color: #3b82f655;
            color: #93c5fd;
        }

        /* Header */
        .game-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background-color: var(--bg-panel);
        }

        .header-left h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-links {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .link-btn {
            background: none;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0;
        }

        .link-restart { color: #eab308; }
        .link-new { color: var(--accent-red); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .stats-container {
            display: flex;
            gap: 12px;
            border-right: 1px solid var(--border-color);
            padding-right: 12px;
        }

        .stat-box {
            width: 85px;
        }

        .stat-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-1-color { color: var(--accent-blue); }
        .stat-2-color { color: var(--accent-orange); }

        .stat-bar-bg {
            width: 100%;
            height: 5px;
            background-color: #262626;
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-bar-fill-1 {
            height: 100%;
            background-color: var(--accent-blue);
            transition: width 0.3s ease;
        }

        .stat-bar-fill-2 {
            height: 100%;
            background-color: var(--accent-orange);
            transition: width 0.3s ease;
        }

        /* Story Log */
        .story-container {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-color: var(--bg-black);
        }

        .message-card {
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            line-height: 1.55;
            font-size: 0.95rem;
            max-width: 92%;
            word-wrap: break-word;
            color: var(--text-main) !important;
            opacity: 1 !important;
            visibility: visible !important;
        }

        .msg-ai {
            background-color: var(--bg-panel);
            align-self: flex-start;
        }

        .msg-user {
            background-color: var(--bg-card);
            align-self: flex-end;
            border-color: #303030;
        }

        .msg-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .action-text {
            font-style: italic;
            color: #8c8c8c !important;
        }

        /* Input Footer */
        .game-footer {
            padding: 12px 18px 16px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-controls {
            display: flex;
            gap: 14px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .control-btn:hover:not(:disabled) {
            color: var(--text-main);
        }

        .control-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
        }

        .input-row .btn-primary {
            flex: 0 0 auto;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-desc {
            font-size: 0.86rem;
            color: #bbbbbb;
            line-height: 1.45;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="setup-screen">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <h1 class="setup-title">Create Your Adventure</h1>
            <button type="button" id="setupKeyBtn" class="btn-small badge-ai">⚙️ Model Settings</button>
        </div>
        <p class="setup-subtitle">
            Fill in whatever you want or <strong>leave any box blank</strong> to let the AI invent it for you!
        </p>

        <form id="setupForm" style="display:flex; flex-direction:column; gap:14px; margin-top:4px;">
            <div class="form-row">
                <div class="form-group">
                    <label for="genreInput">Primary Genre <span class="opt-badge">Auto-generates if blank</span></label>
                    <input type="text" id="genreInput" placeholder="Leave blank for AI surprise (e.g., Cyberpunk)">
                </div>
                <div class="form-group">
                    <label for="subgenreInput">Subgenres <span class="opt-badge">Auto-generates if blank</span></label>
                    <input type="text" id="subgenreInput" placeholder="Leave blank for AI surprise (e.g., Romance)">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="playerNameInput">Your Name <span class="opt-badge">Auto-generates if blank</span></label>
                    <input type="text" id="playerNameInput" placeholder="Leave blank for AI to name you">
                </div>
                <div class="form-group">
                    <label for="playerDescInput">Your Role / Trait <span class="opt-badge">Auto-generates if blank</span></label>
                    <input type="text" id="playerDescInput" placeholder="Leave blank for AI to invent your role">
                </div>
            </div>

            <div class="form-group">
                <label for="charactersInput">Key Characters <span class="opt-badge">Auto-generates if blank</span></label>
                <textarea id="charactersInput" placeholder="Leave blank for AI to create interesting characters..."></textarea>
            </div>

            <div class="form-group">
                <label for="settingInput">Setting & Starting Scenario <span class="opt-badge">Auto-generates if blank</span></label>
                <textarea id="settingInput" placeholder="Leave blank for AI to invent the world and opening scene..."></textarea>
            </div>

            <div class="btn-row">
                <button type="button" id="surpriseBtn" class="btn-secondary">🎲 Surprise Me</button>
                <button type="submit" class="btn-primary">Start Adventure</button>
            </div>
        </form>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="hidden" style="display:flex; flex-direction:column; height:100%;">
        <header class="game-header">
            <div class="header-left">
                <h2 id="headerTitle">Adventure</h2>
                <div id="headerSubtitle" class="header-sub">Genre</div>
                <div class="header-links">
                    <button type="button" id="restartBtn" class="link-btn link-restart">Restart</button>
                    <button type="button" id="newGameBtn" class="link-btn link-new">New Game</button>
                </div>
            </div>

            <div class="header-right">
                <div class="stats-container">
                    <div class="stat-box">
                        <div class="stat-top stat-1-color">
                            <span id="stat1Label">Stat 1</span>
                            <span id="stat1Value">50</span>
                        </div>
                        <div class="stat-bar-bg">
                            <div id="stat1Bar" class="stat-bar-fill-1" style="width: 50%;"></div>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-top stat-2-color">
                            <span id="stat2Label">Stat 2</span>
                            <span id="stat2Value">50</span>
                        </div>
                        <div class="stat-bar-bg">
                            <div id="stat2Bar" class="stat-bar-fill-2" style="width: 50%;"></div>
                        </div>
                    </div>
                </div>

                <div style="display:flex; gap:6px; align-items:center;">
                    <button type="button" id="apiKeyBtn" class="btn-small badge-ai">⚙️ Settings</button>
                    <button type="button" id="exportBtn" class="btn-small">Export</button>
                    <button type="button" id="importBtn" class="btn-small">Import</button>
                    <input type="file" id="importFile" accept=".json" class="hidden">
                </div>
            </div>
        </header>

        <main id="storyLog" class="story-container"></main>

        <footer class="game-footer">
            <div class="footer-controls">
                <button type="button" id="undoBtn" class="control-btn" disabled>↩ Undo</button>
                <button type="button" id="regenBtn" class="control-btn" disabled>↻ Regenerate</button>
            </div>
            <form id="actionForm" class="input-row">
                <input type="text" id="userInput" placeholder="What do you do or say? (Use *asterisks* for actions)" autocomplete="off" required>
                <button type="submit" id="sendBtn" class="btn-primary">Act</button>
            </form>
        </footer>
    </div>
</div>

<!-- API KEY / MODEL SELECTOR MODAL -->
<div id="keyModal" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="modal-title">AI Model & API Settings</div>
        <div class="modal-desc">
            Select your preferred Gemini model version or switch to the keyless public AI gateway.
        </div>
        
        <div class="form-group" style="gap:4px;">
            <label for="modelSelect">Select Gemini Model</label>
            <select id="modelSelect">
                <option value="gemini-3.8-flash">Gemini 3.8 Flash (Default / Recommended)</option>
                <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview (Advanced Reasoning)</option>
                <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Fast & Cost-Efficient)</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash (Legacy Stable)</option>
            </select>
        </div>

        <div class="form-group" style="gap:4px;">
            <label for="apiKeyInput">Google AI Studio API Key <span class="opt-badge">Optional for Public AI</span></label>
            <input type="password" id="apiKeyInput" placeholder="Leave empty to use Free Public AI">
        </div>

        <div id="keyStatusMsg" style="font-size:0.8rem; color:var(--text-muted);"></div>

        <div class="modal-actions">
            <button type="button" id="usePublicAiBtn" class="btn-small">Clear Key (Public AI)</button>
            <button type="button" id="closeKeyModalBtn" class="btn-small">Close</button>
            <button type="button" id="saveKeyModalBtn" class="btn-primary" style="padding:8px 16px; flex:0 0 auto;">Save Settings</button>
        </div>
    </div>
</div>

<!-- CONFIRMATION MODAL -->
<div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-box">
        <div id="confirmTitle" class="modal-title">Confirm</div>
        <div id="confirmDesc" class="modal-desc">Are you sure?</div>
        <div class="modal-actions">
            <button type="button" id="confirmCancelBtn" class="btn-small">Cancel</button>
            <button type="button" id="confirmOkBtn" class="btn-primary" style="padding:8px 16px; background:var(--accent-red); color:#fff; flex:0 0 auto;">Confirm</button>
        </div>
    </div>
</div>

<script>
    const HARDCODED_API_KEY = "";
    const STORAGE_KEY_API = "gemini_adventure_api_key";
    const STORAGE_KEY_MODEL = "gemini_adventure_model";
    const LOCAL_SAVE_KEY = "ai_adventure_save_v5";

    function resolveApiKey() {
        const params = new URLSearchParams(window.location.search);
        const urlKey = params.get("key") || params.get("apiKey");
        if (urlKey && urlKey.trim()) {
            localStorage.setItem(STORAGE_KEY_API, urlKey.trim());
            window.history.replaceState({}, document.title, window.location.pathname);
            return urlKey.trim();
        }
        const saved = localStorage.getItem(STORAGE_KEY_API);
        if (saved && saved.trim()) return saved.trim();
        if (HARDCODED_API_KEY && HARDCODED_API_KEY.trim()) return HARDCODED_API_KEY.trim();
        return "";
    }

    function resolveModel() {
        const saved = localStorage.getItem(STORAGE_KEY_MODEL);
        return saved ? saved : "gemini-3.8-flash";
    }

    let currentApiKey = resolveApiKey();
    let currentModel = resolveModel();

    let gameState = {
        active: false,
        config: null,
        stat1Name: "Stat 1",
        stat2Name: "Stat 2",
        stat1: 50,
        stat2: 50,
        history: []
    };

    // DOM Elements
    const setupScreen = document.getElementById("setupScreen");
    const gameScreen = document.getElementById("gameScreen");
    const setupForm = document.getElementById("setupForm");
    const surpriseBtn = document.getElementById("surpriseBtn");
    const storyLog = document.getElementById("storyLog");
    const actionForm = document.getElementById("actionForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const undoBtn = document.getElementById("undoBtn");
    const regenBtn = document.getElementById("regenBtn");

    const stat1Label = document.getElementById("stat1Label");
    const stat2Label = document.getElementById("stat2Label");
    const stat1Value = document.getElementById("stat1Value");
    const stat2Value = document.getElementById("stat2Value");
    const stat1Bar = document.getElementById("stat1Bar");
    const stat2Bar = document.getElementById("stat2Bar");
    const headerTitle = document.getElementById("headerTitle");
    const headerSubtitle = document.getElementById("headerSubtitle");
    const setupKeyBtn = document.getElementById("setupKeyBtn");
    const apiKeyBtn = document.getElementById("apiKeyBtn");
    const modelSelect = document.getElementById("modelSelect");

    function updateBadgeUI() {
        currentModel = resolveModel();
        currentApiKey = resolveApiKey();
        const shortModelName = currentModel.replace("gemini-", "");
        if (currentApiKey) {
            setupKeyBtn.textContent = `⚡ ${shortModelName} (Key)`;
            apiKeyBtn.textContent = `⚡ ${shortModelName}`;
        } else {
            setupKeyBtn.textContent = `🌐 ${shortModelName} (Public)`;
            apiKeyBtn.textContent = `🌐 ${shortModelName}`;
        }
    }

    function formatText(rawText) {
        const escaped = String(rawText || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        const withActions = escaped.replace(/\*([^*]+)\*/g, '<span class="action-text">*$1*</span>');
        return withActions.replace(/\n/g, "<br>");
    }

    function updateUI() {
        updateBadgeUI();
        if (!gameState.active) {
            setupScreen.classList.remove("hidden");
            gameScreen.classList.add("hidden");
            return;
        }

        setupScreen.classList.add("hidden");
        gameScreen.classList.remove("hidden");

        const pName = gameState.config?.playerName || "Traveler";
        const gName = gameState.config?.genre || "Generating World...";
        const subName = gameState.config?.subgenre ? ` • ${gameState.config.subgenre}` : "";

        headerTitle.textContent = `${pName}'s Adventure`;
        headerSubtitle.textContent = `${gName}${subName}`;

        stat1Label.textContent = gameState.stat1Name;
        stat2Label.textContent = gameState.stat2Name;
        stat1Value.textContent = gameState.stat1;
        stat2Value.textContent = gameState.stat2;
        stat1Bar.style.width = `${Math.max(0, Math.min(100, gameState.stat1))}%`;
        stat2Bar.style.width = `${Math.max(0, Math.min(100, gameState.stat2))}%`;

        storyLog.innerHTML = "";
        gameState.history.forEach(item => {
            if (item.hiddenPrompt) return;
            const card = document.createElement("div");
            card.className = `message-card ${item.role === "user" ? "msg-user" : "msg-ai"}`;
            const label = document.createElement("div");
            label.className = "msg-label";
            label.textContent = item.role === "user" ? "YOU" : "STORY";
            const content = document.createElement("div");
            content.innerHTML = formatText(item.text);
            card.appendChild(label);
            card.appendChild(content);
            storyLog.appendChild(card);
        });

        storyLog.scrollTop = storyLog.scrollHeight;

        const visibleTurns = gameState.history.filter(h => !h.hiddenPrompt);
        undoBtn.disabled = visibleTurns.length <= 1;
        regenBtn.disabled = visibleTurns.length === 0;
    }

    function saveGame() {
        localStorage.setItem(LOCAL_SAVE_KEY, JSON.stringify(gameState));
    }

    function loadGame() {
        const raw = localStorage.getItem(LOCAL_SAVE_KEY);
        if (!raw) {
            updateBadgeUI();
            return;
        }
        try {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.active && parsed.config) {
                gameState = parsed;
                updateUI();
            }
        } catch (e) {
            console.error("Failed to load saved game:", e);
        }
    }

    function buildSystemPrompt() {
        const c = gameState.config || {};
        return `You are an interactive fiction Game Master running an engaging text adventure game.

Current World & Character Configuration (any field marked "[AI TO INVENT]" MUST be creatively invented by you right now on Turn 1!):
- Primary Genre: ${c.genre || "[AI TO INVENT]"}
- Supporting Subgenres: ${c.subgenre || "[AI TO INVENT]"}
- Player Name: ${c.playerName || "[AI TO INVENT]"}
- Player Role / Trait: ${c.playerDesc || "[AI TO INVENT]"}
- Key Characters: ${c.characters || "[AI TO INVENT]"}
- Setting & Starting Scenario: ${c.setting || "[AI TO INVENT]"}

Formatting & Gameplay Rules:
1. Write in second person ("You..."). Keep responses vivid, immersive, and concise (2 to 4 short paragraphs).
2. Wrap ALL physical actions, body language, environmental descriptions, and inner thoughts in single asterisks like *this* so they render in cursive. Keep spoken dialogue in standard quotes like "this" outside of asterisks.
3. Never decide the player's actions or spoken lines for them. End every turn at a moment where the player can act or speak.
4. On the VERY FIRST turn, if any setup fields were "[AI TO INVENT]", seamlessly introduce your invented player name, role, genre tone, characters, and setting in the opening scene, and return those invented values inside the hidden ||STATS:{...}|| JSON block so the game engine saves them permanently.
5. Also on the VERY FIRST turn, invent two fitting 1-word personality/status meter names tailored to the genre (e.g., "Grit" & "Sanity", "Charm" & "Sync", "Honor" & "Cunning").
6. At the VERY END of EVERY response, append a single hidden metadata block in this exact one-line format:
||STATS:{"stat1Name": "${gameState.stat1Name}", "stat2Name": "${gameState.stat2Name}", "stat1Delta": 0, "stat2Delta": 0, "playerName": "${c.playerName || ""}", "playerDesc": "${c.playerDesc || ""}", "genre": "${c.genre || ""}", "subgenre": "${c.subgenre || ""}", "characters": "${c.characters || ""}", "setting": "${c.setting || ""}"}||
(Always replace empty strings in the JSON with the concrete values you invented, replace "Stat 1" and "Stat 2" with your two 1-word meter names, and use integer deltas between -10 and +10 on subsequent turns.)`;
    }

    async function callPublicPollinationsAI(systemPrompt, contents) {
        const messages = [
            { role: "system", content: systemPrompt },
            ...contents.map(c => ({
                role: c.role === "model" ? "assistant" : "user",
                content: c.parts[0].text
            }))
        ];

        const response = await fetch("https://text.pollinations.ai/openai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: currentModel.includes("pro") ? "openai-large" : "gemini",
                messages,
                temperature: 0.85
            })
        });

        if (!response.ok) {
            throw new Error(`Public AI Gateway HTTP ${response.status}`);
        }

        const data = await response.json();
        const text = data?.choices?.[0]?.message?.content;
        if (!text) throw new Error("Empty response from Public AI gateway.");
        return text;
    }

    async function callAI(contents) {
        const systemPrompt = buildSystemPrompt();
        currentApiKey = resolveApiKey();
        currentModel = resolveModel();

        // 1. If user provided a personal Google AI Studio key, call official Gemini endpoint directly
        if (currentApiKey) {
            const systemInstruction = { parts: [{ text: systemPrompt }] };
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${encodeURIComponent(currentApiKey)}`;
            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ systemInstruction, contents })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(`[${currentModel}] ${data?.error?.message || res.status}`);
                }
                const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (reply) return reply;
            } catch (e) {
                console.warn("Direct key call failed, falling back to Public AI:", e);
            }
        }

        // 2. Zero-config Public AI Fallback
        return await callPublicPollinationsAI(systemPrompt, contents);
    }

    function parseAndApplyStats(rawReply) {
        let cleanText = rawReply;
        const regex = /\|\|STATS:(\{[\s\S]*?\})\|\|/;
        const match = rawReply.match(regex);

        if (match) {
            cleanText = rawReply.replace(regex, "").trim();
            try {
                const statsObj = JSON.parse(match[1]);
                if (statsObj.stat1Name && (gameState.stat1Name === "Stat 1" || !gameState.stat1Name)) {
                    gameState.stat1Name = String(statsObj.stat1Name).slice(0, 14);
                }
                if (statsObj.stat2Name && (gameState.stat2Name === "Stat 2" || !gameState.stat2Name)) {
                    gameState.stat2Name = String(statsObj.stat2Name).slice(0, 14);
                }

                if (gameState.config) {
                    if (!gameState.config.playerName && statsObj.playerName) {
                        gameState.config.playerName = String(statsObj.playerName).trim();
                    }
                    if (!gameState.config.playerDesc && statsObj.playerDesc) {
                        gameState.config.playerDesc = String(statsObj.playerDesc).trim();
                    }
                    if (!gameState.config.genre && statsObj.genre) {
                        gameState.config.genre = String(statsObj.genre).trim();
                    }
                    if (!gameState.config.subgenre && statsObj.subgenre) {
                        gameState.config.subgenre = String(statsObj.subgenre).trim();
                    }
                    if (!gameState.config.characters && statsObj.characters) {
                        gameState.config.characters = String(statsObj.characters).trim();
                    }
                    if (!gameState.config.setting && statsObj.setting) {
                        gameState.config.setting = String(statsObj.setting).trim();
                    }
                }

                const d1 = Number(statsObj.stat1Delta) || 0;
                const d2 = Number(statsObj.stat2Delta) || 0;
                gameState.stat1 = Math.max(0, Math.min(100, gameState.stat1 + d1));
                gameState.stat2 = Math.max(0, Math.min(100, gameState.stat2 + d2));
            } catch (e) {
                console.warn("Could not parse STATS JSON:", e);
            }
        }

        if (gameState.config) {
            if (!gameState.config.playerName) gameState.config.playerName = "Wanderer";
            if (!gameState.config.genre) gameState.config.genre = "Mystery Adventure";
        }

        return cleanText;
    }

    async function generateTurn() {
        sendBtn.disabled = true;
        userInput.disabled = true;
        undoBtn.disabled = true;
        regenBtn.disabled = true;

        const loadingCard = document.createElement("div");
        loadingCard.className = "message-card msg-ai";
        loadingCard.innerHTML = `<div class="msg-label">STORY</div><div class="action-text">*Generating scene...*</div>`;
        storyLog.appendChild(loadingCard);
        storyLog.scrollTop = storyLog.scrollHeight;

        const apiContents = gameState.history.map(h => ({
            role: h.role,
            parts: [{ text: h.text }]
        }));

        try {
            const rawReply = await callAI(apiContents);
            const cleanReply = parseAndApplyStats(rawReply);

            gameState.history.push({
                role: "model",
                text: cleanReply,
                stat1: gameState.stat1,
                stat2: gameState.stat2,
                stat1Name: gameState.stat1Name,
                stat2Name: gameState.stat2Name
            });
            saveGame();
            updateUI();
        } catch (err) {
            loadingCard.innerHTML = `<div class="msg-label" style="color:var(--accent-red);">AI CONNECTION ERROR</div><div>${formatText(err.message)}</div>`;
        } finally {
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
            const visibleTurns = gameState.history.filter(h => !h.hiddenPrompt);
            undoBtn.disabled = visibleTurns.length <= 1;
            regenBtn.disabled = visibleTurns.length === 0;
        }
    }

    async function startNewScenario() {
        gameState.stat1Name = "Stat 1";
        gameState.stat2Name = "Stat 2";
        gameState.stat1 = 50;
        gameState.stat2 = 50;

        const c = gameState.config;
        const missingFields = [];
        if (!c.genre) missingFields.push("Primary Genre");
        if (!c.subgenre) missingFields.push("Subgenre");
        if (!c.playerName) missingFields.push("Player Name");
        if (!c.playerDesc) missingFields.push("Player Role/Trait");
        if (!c.characters) missingFields.push("Key Characters");
        if (!c.setting) missingFields.push("Setting & Opening Scenario");

        const autoGenInstruction = missingFields.length > 0
            ? `The player left these setup fields blank: [${missingFields.join(", ")}]. Creatively invent compelling, specific details for every blank field right now, weave them naturally into the opening scene, and include your invented values in the ||STATS:{...}|| JSON block at the end.`
            : `Introduce the setting (${c.setting}) and the initial situation with ${c.characters}.`;

        gameState.history = [
            {
                role: "user",
                text: `Start the adventure now. ${autoGenInstruction} Remember to format actions/thoughts in *asterisks* and invent the two 1-word genre-specific stat names in the ||STATS:{...}|| block.`,
                hiddenPrompt: true,
                stat1: 50,
                stat2: 50,
                stat1Name: "Stat 1",
                stat2Name: "Stat 2"
            }
        ];
        saveGame();
        updateUI();
        await generateTurn();
    }

    function launchFromForm() {
        gameState.config = {
            genre: document.getElementById("genreInput").value.trim(),
            subgenre: document.getElementById("subgenreInput").value.trim(),
            playerName: document.getElementById("playerNameInput").value.trim(),
            playerDesc: document.getElementById("playerDescInput").value.trim(),
            characters: document.getElementById("charactersInput").value.trim(),
            setting: document.getElementById("settingInput").value.trim()
        };
        gameState.active = true;
        startNewScenario();
    }

    setupForm.addEventListener("submit", (e) => {
        e.preventDefault();
        launchFromForm();
    });

    surpriseBtn.addEventListener("click", () => {
        setupForm.reset();
        launchFromForm();
    });

    actionForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = "";

        gameState.history.push({
            role: "user",
            text,
            stat1: gameState.stat1,
            stat2: gameState.stat2,
            stat1Name: gameState.stat1Name,
            stat2Name: gameState.stat2Name
        });
        saveGame();
        updateUI();
        await generateTurn();
    });

    undoBtn.addEventListener("click", () => {
        if (gameState.history.length <= 2) return;
        if (gameState.history[gameState.history.length - 1].role === "model") {
            gameState.history.pop();
        }
        if (gameState.history.length > 1 && gameState.history[gameState.history.length - 1].role === "user") {
            gameState.history.pop();
        }
        const last = gameState.history[gameState.history.length - 1];
        if (last) {
            gameState.stat1 = last.stat1 ?? 50;
            gameState.stat2 = last.stat2 ?? 50;
            gameState.stat1Name = last.stat1Name || gameState.stat1Name;
            gameState.stat2Name = last.stat2Name || gameState.stat2Name;
        }
        saveGame();
        updateUI();
    });

    regenBtn.addEventListener("click", async () => {
        if (gameState.history.length === 0) return;
        if (gameState.history[gameState.history.length - 1].role === "model") {
            gameState.history.pop();
        }
        const prev = gameState.history[gameState.history.length - 1];
        if (prev) {
            gameState.stat1 = prev.stat1 ?? 50;
            gameState.stat2 = prev.stat2 ?? 50;
        }
        saveGame();
        updateUI();
        await generateTurn();
    });

    // Confirmation Modal
    const confirmModal = document.getElementById("confirmModal");
    const confirmTitle = document.getElementById("confirmTitle");
    const confirmDesc = document.getElementById("confirmDesc");
    const confirmOkBtn = document.getElementById("confirmOkBtn");
    const confirmCancelBtn = document.getElementById("confirmCancelBtn");
    let pendingConfirmAction = null;

    function openConfirmModal(title, desc, onConfirm) {
        confirmTitle.textContent = title;
        confirmDesc.textContent = desc;
        pendingConfirmAction = onConfirm;
        confirmModal.classList.remove("hidden");
    }

    confirmCancelBtn.addEventListener("click", () => {
        confirmModal.classList.add("hidden");
        pendingConfirmAction = null;
    });

    confirmOkBtn.addEventListener("click", () => {
        confirmModal.classList.add("hidden");
        if (pendingConfirmAction) pendingConfirmAction();
        pendingConfirmAction = null;
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
        openConfirmModal(
            "Restart Current Adventure?",
            "This will reset your conversation history and stats to 50, generating a fresh opening scene with your current setup.",
            () => startNewScenario()
        );
    });

    document.getElementById("newGameBtn").addEventListener("click", () => {
        openConfirmModal(
            "Start a Brand New Game?",
            "This will delete your current save and return you to the setup screen.",
            () => {
                localStorage.removeItem(LOCAL_SAVE_KEY);
                gameState = {
                    active: false,
                    config: null,
                    stat1Name: "Stat 1",
                    stat2Name: "Stat 2",
                    stat1: 50,
                    stat2: 50,
                    history: []
                };
                setupForm.reset();
                updateUI();
            }
        );
    });

    // API Key & Model Modal
    const keyModal = document.getElementById("keyModal");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const keyStatusMsg = document.getElementById("keyStatusMsg");

    function openKeyModal(statusText = "") {
        apiKeyInput.value = resolveApiKey();
        modelSelect.value = resolveModel();
        keyStatusMsg.textContent = statusText || (apiKeyInput.value
            ? `Custom key active with model: ${currentModel}`
            : `Using Free Public AI with model: ${currentModel}`);
        keyModal.classList.remove("hidden");
    }

    apiKeyBtn.addEventListener("click", () => openKeyModal());
    setupKeyBtn.addEventListener("click", () => openKeyModal());
    document.getElementById("closeKeyModalBtn").addEventListener("click", () => keyModal.classList.add("hidden"));

    document.getElementById("usePublicAiBtn").addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY_API);
        apiKeyInput.value = "";
        currentApiKey = "";
        updateBadgeUI();
        keyStatusMsg.style.color = "var(--accent-green)";
        keyStatusMsg.textContent = "Cleared key. Switched to Free Public AI!";
    });

    document.getElementById("saveKeyModalBtn").addEventListener("click", () => {
        const val = apiKeyInput.value.trim();
        const selectedModel = modelSelect.value;
        
        localStorage.setItem(STORAGE_KEY_MODEL, selectedModel);
        currentModel = selectedModel;

        if (val) {
            localStorage.setItem(STORAGE_KEY_API, val);
            currentApiKey = val;
            keyStatusMsg.style.color = "var(--accent-green)";
            keyStatusMsg.textContent = `Saved! Model ${selectedModel} configured with API key.`;
        } else {
            localStorage.removeItem(STORAGE_KEY_API);
            currentApiKey = "";
            keyStatusMsg.style.color = "var(--accent-green)";
            keyStatusMsg.textContent = `Saved! Model ${selectedModel} configured for Public AI.`;
        }
        updateBadgeUI();
        setTimeout(() => {
            keyModal.classList.add("hidden");
            keyStatusMsg.style.color = "var(--text-muted)";
        }, 900);
    });

    // Export / Import
    document.getElementById("exportBtn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(gameState, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${(gameState.config?.playerName || "adventure").toLowerCase()}_save.json`;
        a.click();
        URL.revokeObjectURL(url);
    });

    const importFile = document.getElementById("importFile");
    document.getElementById("importBtn").addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (imported && imported.config && Array.isArray(imported.history)) {
                    gameState = imported;
                    gameState.active = true;
                    saveGame();
                    updateUI();
                }
            } catch (err) {
                console.error("Invalid save file:", err);
            }
        };
        reader.readAsText(file);
    });

    // Initialize
    loadGame();
</script>
</body>
